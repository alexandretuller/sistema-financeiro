<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Saídas</title>
  <style>
    .home-button {
      position: absolute;
      top: 10px;
      right: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    table, th, td {
      border: 1px solid black;
    }
    th, td {
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #f2f2f2;
    }
    .filter-container {
      margin-bottom: 20px;
    }
    .filter-container select {
      padding: 10px;
      margin-right: 10px;
    }
    .export-button {
      margin-bottom: 20px;
    }
    /* Estilo do botão de excluir */
    .btn-excluir {
        background-color: #ff4d4d;
        color: white;
        border: none;
        padding: 5px 10px;
        cursor: pointer;
        border-radius: 4px;
    }
    .btn-excluir:hover {
        background-color: #cc0000;
    }
  </style>
</head>
<body>
  <h1>Saídas</h1>
  <div class="home-button">
    <a href="/"><img src="../static/casinha.png" alt="Home" width="60" height="60"></a>
  </div>
  <div class="filter-container">
    <label for="ano">Ano:</label>
    <select id="ano" name="ano">
      <option value="">Selecione o ano</option>
      </select>

    <label for="fonte">Fonte:</label>
    <select id="fonte" name="fonte">
      <option value="">Selecione a fonte</option>
      </select>
  </div>

  <button class="export-button" onclick="exportTableToExcel('saidasTable', 'saidas')">Exportar para Excel</button>

  <table id="saidasTable">
    <thead>
      <tr>
        <th>Data de pagamento</th>
        <th>Fornecedor</th>
        <th>CNPJ</th>
        <th>Capital/Custeio</th>
        <th>Descrição do produto/serviço</th>
        <th>Valor (R$)</th>
        <th>Fonte</th>
        <th>Sub fonte</th>
        <th>Ações</th> </tr>
    </thead>
    <tbody>
      </tbody>
  </table>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.inputmask/5.0.6/jquery.inputmask.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>
  <script>
    function exportTableToExcel(tableID, filename = ''){
      var table = document.getElementById(tableID);
      var wb = XLSX.utils.table_to_book(table, {sheet: "Sheet1"});
      var wbout = XLSX.write(wb, {bookType: 'xlsx', type: 'binary'});

      function s2ab(s) {
        var buf = new ArrayBuffer(s.length);
        var view = new Uint8Array(buf);
        for (var i = 0; i < s.length; i++) view[i] = s.charCodeAt(i) & 0xFF;
        return buf;
      }

      var blob = new Blob([s2ab(wbout)], {type: "application/octet-stream"});
      var link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = filename ? filename + '.xlsx' : 'excel_data.xlsx';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    $(document).ready(function() {
      // Função para carregar os anos e fontes dinamicamente
      function carregarFiltros() {
        $.ajax({
          url: '/get_filtros_saida',
          method: 'GET',
          success: function(data) {
            // Preenche a lista de anos
            var anos = data.anos;
            var anoSelect = $('#ano');
            anoSelect.empty();
            anoSelect.append('<option value="">Selecione o ano</option>');
            anos.forEach(function(ano) {
              anoSelect.append('<option value="' + ano + '">' + ano + '</option>');
            });

            // Preenche a lista de fontes
            var fontes = data.fontes;
            var fonteSelect = $('#fonte');
            fonteSelect.empty();
            fonteSelect.append('<option value="">Selecione a fonte</option>');
            fontes.forEach(function(fonte) {
                fonteSelect.append('<option value="' + fonte + '">' + fonte + '</option>');
            });
          }
        });
      }

      // Função para carregar as saídas dinamicamente
      function carregarSaidas() {
        var ano = $('#ano').val();
        var fonte = $('#fonte').val();
        $.ajax({
          url: '/get_saidas',
          method: 'GET',
          data: { ano: ano, fonte: fonte },
          success: function(data) {
            var saidas = data.saidas;
            var tbody = $('#saidasTable tbody');
            tbody.empty();
            saidas.forEach(function(saida) {
                var valorFormatado = (saida.valor / 100).toFixed(2).replace('.', ',');
                
                // CRIAÇÃO DA LINHA COM O BOTÃO
                var row = '<tr data-id="' + saida.id + '">' +
                '<td>' + saida.data + '</td>' +
                '<td>' + saida.fornecedor + '</td>' +
                '<td>' + saida.cnpj + '</td>' +
                '<td>' + saida.capcus + '</td>' +
                '<td>' + saida.descricao + '</td>' +
                '<td class="valor">R$ ' + valorFormatado + '</td>' +
                '<td>' + saida.fonte + '</td>' +
                '<td>' + saida.subfonte + '</td>' +
                '<td style="text-align:center;">' + 
                    '<button class="btn-excluir" data-id="' + saida.id + '">Excluir</button>' + 
                '</td>' +
                '</tr>';
              tbody.append(row);
            });

            // Aplica a máscara de R$ na coluna do valor (opcional se já formatou string acima, mas mantive seu código)
            /* Nota: Como você formatou manualmente na string 'row' acima, o inputmask pode 
               não ser estritamente necessário para visualização, mas mantive para compatibilidade.
            */

            // Lógica do DUPLO CLIQUE (Editar)
            $('#saidasTable tbody tr').dblclick(function() {
              var saidaId = $(this).data('id');
              if (saidaId) {
                window.location.href = "/editar_saida?saidaId=" + saidaId;
              } else {
                console.error("ID da saída não encontrado.");
              }
            });

            // Lógica do BOTÃO EXCLUIR
            $('.btn-excluir').off('click').on('click', function(e) {
                e.stopPropagation(); // Impede que o clique ative a edição (duplo clique)
                
                var id = $(this).data('id');
                var linha = $(this).closest('tr');

                if(confirm("Tem certeza que deseja excluir esta saída? Esta ação não pode ser desfeita.")) {
                    $.ajax({
                        url: '/excluir_saida',
                        method: 'POST',
                        data: { id: id },
                        success: function(response) {
                            if(response.success) {
                                linha.fadeOut(300, function(){ $(this).remove(); });
                            } else {
                                alert("Erro ao excluir: " + response.message);
                            }
                        },
                        error: function() {
                            alert("Erro de comunicação com o servidor.");
                        }
                    });
                }
            });

          }
        });
      }

      // Carrega os filtros ao carregar a página
      carregarFiltros();

      // Carrega as saídas ao selecionar um filtro
      $('#ano, #fonte').change(function() {
        carregarSaidas();
      });
    });
  </script>
</body>
</html>
