<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes dos Itens</title>
  <style>
        .home-button {
            position: absolute;
            top: 10px;
            right: 10px;
        }
    /* Adicione margem ao botão e à tabela */
    button, table {
      margin-top: 20px;
    }
    /* Cor de fundo alternada para as linhas da tabela */
    tr:nth-child(even) {
      background-color: #bbbbbb;
    }
    /* Cor de fundo ao passar o mouse sobre a linha */
    tr:hover {
      background-color: orange;
    }
    /* Cor de fundo ao selecionar o checkbox */
    tr.selected {
      background-color: rgb(98, 223, 98);
    }
    /* Adicione bordas pretas às células da tabela */
    td, th {
      border: 1px solid black;
    }
    button[type="button"] {
      background-color: #4CAF50; /* Green */
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="home-button">
    <a href="/"><img src="../static/casinha.png" alt="Home" width="60" height="60"></a>
</div>
  <h1>Detalhes dos Itens</h1>

  <label for="categoria">Categoria do item:</label>
  <select id="categoria" name="categoria" onchange="updateItems(this.value)">
    <option value="">Selecione uma categoria</option>
    {% for categoria in categorias %}
      <option value="{{ categoria }}">{{ categoria }}</option>
    {% endfor %}
  </select>

  <table id="detailsTable">
    <tr>
      <th>Categoria</th>
      <th>Descrição</th>
      <th>Unidade</th>
      <th>Data da Compra</th>
      <th>Quantidade</th>
      <th>Valor Unitário</th>
      <th>Fornecedor</th>
    </tr>
    <!-- As linhas da tabela serão preenchidas dinamicamente -->
  </table>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script>
    function updateItems(categoria) {
      // Faz uma requisição AJAX para o servidor
      $.post('/get_itens', { categoria: categoria }, function(itens) {
        // Limpar a tabela de detalhes e os itens da categoria
        $('#item').empty();
        // Adiciona cada item à lista suspensa
        itens.forEach(function(item) {
          $('#item').append('<option value="' + item.id + '">' + item.descricaoitem + '</option>');
        });
        // Atualiza a tabela de detalhes
        updateDetails(categoria);
      });
    }

    function updateDetails(categoria) {
      if (categoria) {  // Verifique se a categoria foi selecionada
        // Faz uma requisição AJAX para o servidor
        $.post('/detalhesitens', { categoria: categoria }, function(detalhes) {
          // Limpar a tabela
          $('#detailsTable').find('tr:gt(0)').remove();
          // Iterar sobre cada item em detalhes
          for (var descricaoitem in detalhes) {
            // Ordenar os detalhes do item por data
            detalhes[descricaoitem].sort(function(a, b) {
              return new Date(b.dataitem) - new Date(a.dataitem);
            });
            // Adicionar cada detalhe à tabela
            detalhes[descricaoitem].forEach(function(detalhe, index) {
              var valorFormatado = (detalhe.valoritem / 100).toFixed(2).replace('.', ','); // Formatar o valor para R$
              var row = '<tr>';
              if (index === 0) {  // Se for a primeira linha, adicionar categoria, descrição e unidade
                row += '<td>' + categoria + '</td><td>' + detalhe.descricaoitem + '</td><td>' + detalhe.unidadeitem + '</td>';
              } else {  // Caso contrário, deixar essas células vazias
                row += '<td></td><td></td><td></td>';
              }
              row += '<td>' + detalhe.dataitem + '</td><td>' + detalhe.qtditem + '</td><td>R$ ' + valorFormatado + '</td><td>' + detalhe.fornitem + '</td></tr>';
              $('#detailsTable').append(row);
            });
          }
        });
      }
    }
  </script>
</body>
</html>
